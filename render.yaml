services:
  - type: web
    name: marketclab-quiz
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: DATABASE_PATH
        value: /data/quiz.db
      - key: Claude__ApiKey
        sync: false   # הגדר ידנית בלוח Render → Environment
      - key: Payment__Url
        value: https://meshulam.co.il/quick_payment?b=94e3eb6d1865b2f42bef52f9966512df
    disk:
      name: marketclab-data
      mountPath: /data       # ← כאן נשמר ה-SQLite לצמיתות
      sizeGB: 1
